[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-onyx-admin"
version = "0.1.0"
description = "A modern, readable Django admin theme with light and dark mode, a command palette and a real dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "onyx_admin/static/onyx_admin/fonts/LICENSE-OFL.txt", "onyx_admin/static/onyx_admin/fonts/inter/LICENSE-OFL.txt"]
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]
keywords = ["django", "admin", "theme", "dark mode", "dashboard"]
authors = [{ name = "gingerbreadfork", email = "gingerbreadfork@protonmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/Gingerbreadfork/django-onyx-admin"
Repository = "https://github.com/Gingerbreadfork/django-onyx-admin"
Changelog = "https://github.com/Gingerbreadfork/django-onyx-admin/blob/main/CHANGELOG.md"
Issues = "https://github.com/Gingerbreadfork/django-onyx-admin/issues"

[dependency-groups]
dev = ["pytest", "pytest-django", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["onyx_admin"]

[tool.hatch.build.targets.sdist]
include = ["onyx_admin", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["demo/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
