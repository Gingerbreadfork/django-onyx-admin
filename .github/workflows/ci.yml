name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          - { python: "3.10", django: "6.0" }
          - { python: "3.10", django: "6.1" }
          - { python: "3.11", django: "6.0" }
          - { python: "3.11", django: "6.1" }
          - { python: "3.14", django: "5.2" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv --clear
          uv pip install "Django~=${{ matrix.django }}.0" pytest pytest-django ruff -e .
          .venv/bin/python -c "import django, sys; print('Django', django.get_version(), 'on Python', sys.version.split()[0])"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: .venv/bin/pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
